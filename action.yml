name: "Run Playwright tests"
description: "Runs Playwright tests via npm run test"
branding:
  icon: "fast-forward"
  color: "purple"

runs:
  using: "composite"
  steps:
    - uses: actions/checkout@v6

    - name: Set default values for environment variables
      shell: bash
      run: |
        echo "WOPEE_SCREENSHOT_VALIDATION_ENABLED=${WOPEE_SCREENSHOT_VALIDATION_ENABLED:-true}" >> $GITHUB_ENV
        echo "WOPEE_COLLECT_PAGE_CONTENT=${WOPEE_COLLECT_PAGE_CONTENT:-true}" >> $GITHUB_ENV

    - name: Load client_payload.env → $GITHUB_ENV
      if: github.event.client_payload.env
      shell: bash
      run: |
        # Mask secret-looking values BEFORE they enter $GITHUB_ENV: from there every later
        # step prints them in its `env:` header. Commander project variables such as
        # KERBEROS_PASSWORD or BASIC_AUTH_PASSWORD arrive here as plain strings; only the
        # repo secret WOPEE_API_KEY was masked by GitHub. Multi-line values line by line.
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | select(.key | ascii_upcase | test("PASS|PWD|SECRET|TOKEN|CREDENTIAL|PRIVATE|KEYTAB|_KEY$"))
          | (.value | tostring | split("\n")[] | select(length > 0))
          | "::add-mask::\(.)"
        ' "$GITHUB_EVENT_PATH"
        jq -r '
          .client_payload.env
          | to_entries[]
          | select(.value != null)
          | if (.value | type=="string" and test("\n"))
              then "\(.key)<<EOF\n\(.value)\nEOF"
              else "\(.key)=\(.value)"
            end
        ' "$GITHUB_EVENT_PATH" >> "$GITHUB_ENV"

    - name: Load .github/workflows/.env → $GITHUB_ENV
      shell: bash
      run: |
        if [ -f .github/workflows/.env ]; then
          # Extract valid KEY=VALUE lines; if none are found, skip without failing the step
          LINES="$(grep -vE '^(#|$)' .github/workflows/.env | grep -E '^[A-Za-z_][A-Za-z0-9_]*=' || true)"
          # Same masking as for client_payload.env, before the values reach $GITHUB_ENV.
          while IFS= read -r line; do
            key="${line%%=*}"; value="${line#*=}"
            if [ -n "$value" ] && [[ "${key^^}" =~ (PASS|PWD|SECRET|TOKEN|CREDENTIAL|PRIVATE|KEYTAB|_KEY$) ]]; then
              echo "::add-mask::${value}"
            fi
          done <<< "$LINES"
          [ -z "$LINES" ] || printf '%s\n' "$LINES" >> "$GITHUB_ENV"
        fi

    # Windows SSO (backlog#4738). An app whose identity provider answers only
    # `401 Negotiate` needs a Kerberos ticket before the tests' browser starts: on Linux
    # Chromium never turns a name and password into one. The account comes from
    # Commander's variables: KERBEROS_PRINCIPAL/KERBEROS_PASSWORD (KERBEROS_SSO=off turns
    # it off). This job runs the whole Playwright project in one browser process, so it
    # signs in once: a per-test KERBEROS_ACCOUNTS map can only apply its `*` entry here
    # (per-test accounts work in agent runs, one test per job). The runtime image's
    # wopee-kerberos does one kinit (no retry: parallel runs would lock the account) and
    # hands KRB5_CONFIG, KRB5CCNAME, the --auth-server-allowlist switch (in
    # WOPEE_BROWSER_ARGS) and every KERBEROS_PASSWORD* blanked to the test step.
    # Unset: skipped.
    - name: Kerberos sign-in
      if: env.KERBEROS_PRINCIPAL != '' || env.KERBEROS_ACCOUNTS != ''
      shell: bash
      run: |
        if ! command -v wopee-kerberos >/dev/null 2>&1; then
          echo "::error::Kerberos sign-in is configured (KERBEROS_*), but this runner image has no wopee-kerberos — it needs a newer runtime image."
          exit 1
        fi
        # The switch reaches the browser only through the project's playwright.config.ts
        # (template#46 and later read WOPEE_BROWSER_ARGS); an older config never passes it.
        if ! grep -qs WOPEE_BROWSER_ARGS playwright.config.ts playwright.config.js playwright.config.mjs; then
          echo "::warning::playwright.config does not read WOPEE_BROWSER_ARGS, so Chromium will not answer the Negotiate challenge. Add the WOPEE_BROWSER_ARGS launch args from the current playwright-template."
        fi
        rc=0
        OUT="$(wopee-kerberos login)" || rc=$?
        if [ "$rc" -ne 0 ]; then
          echo "::error::Kerberos sign-in failed (wopee-kerberos exit ${rc}) — the reason is on the line above."
          exit "$rc"
        fi
        [ -z "$OUT" ] || printf '%s\n' "$OUT" >> "$GITHUB_ENV"
        active="$(printf '%s\n' "$OUT" | sed -n 's/^KERBEROS_ACTIVE_PRINCIPAL=//p')"
        echo "Kerberos sign-in: ${active:-not used for this run}"

    - name: Receive code
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.code != null
      shell: bash
      run: |
        rm -rf tests/*
        echo "${{ github.event.client_payload.code }}" | base64 --decode > tests/code.spec.ts

    - name: Set suite name if provided
      # The dispatch payload carries suite.name (see the assignment below and run-agent);
      # this condition used to test a nonexistent client_payload.suite_name key, so a
      # provided suite name was silently ignored and the generated fallback name won.
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.suite.name != null
      shell: bash
      run: |
        echo 'WOPEE_SUITE_NAME=${{ github.event.client_payload.suite.name }}' >> $GITHUB_ENV

    - name: Set suite uuid if provided
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.suite.uuid != null
      shell: bash
      run: |
        echo 'WOPEE_SUITE_UUID=${{ github.event.client_payload.suite.uuid }}' >> $GITHUB_ENV

    - name: Set test case id if provided
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.testCase.testCaseId != null
      shell: bash
      run: |
        echo "WOPEE_TEST_CASE_ID=${{ github.event.client_payload.testCase.testCaseId }}" >> $GITHUB_ENV

    - name: Set user story id if provided
      if: github.event_name == 'repository_dispatch' && github.event.client_payload.testCase.userStoryId != null
      shell: bash
      run: |
        echo "WOPEE_USER_STORY_ID=${{ github.event.client_payload.testCase.userStoryId }}" >> $GITHUB_ENV

    - name: Set TESTING_USERNAME
      if: github.event.client_payload.suiteAnalysisConfig != null && github.event.client_payload.suiteAnalysisConfig.username != null
      shell: bash
      run: |
        echo "TESTING_USERNAME=${{ github.event.client_payload.suiteAnalysisConfig.username }}" >> $GITHUB_ENV

    - name: Set TESTING__PASSWORD
      if: github.event.client_payload.suiteAnalysisConfig != null && github.event.client_payload.suiteAnalysisConfig.password != null
      shell: bash
      run: |
        echo "TESTING__PASSWORD=${{ github.event.client_payload.suiteAnalysisConfig.password }}" >> $GITHUB_ENV

    - name: Generate WOPEE_SUITE_NAME if not set
      if: ${{ env.WOPEE_SUITE_NAME == '' }}
      shell: bash
      run: echo "WOPEE_SUITE_NAME=Testing-$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

    - name: Run tests
      # env:
      #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      #   WOPEE_API_KEY: ${{ secrets.WOPEE_API_KEY }}
      #   WOPEE_API_URL: ${{ vars.WOPEE_API_URL || 'https://api.wopee.io' }}
      #   WOPEE_PROJECT_UUID: ${{ vars.WOPEE_PROJECT_UUID }}
      #   WOPEE_PROJECT_URL: ${{ vars.WOPEE_PROJECT_URL || 'https://dronjo.wopee.io' }}
      #   WOPEE_SCREENSHOT_VALIDATION_ENABLED: "true"
      #   WOPEE_BRANCH_NAME: master
      #   WOPEE_CI_BUILD_ID: build-123
      #   WOPEE_CUSTOM_TAGS: custom-tag
      #   WOPEE_ENABLE_SOFT_ASSERT: "true"
      #   WOPEE_PIXEL_TO_PIXEL_DIFF_TOLERANCE: "0.1"
      #   WOPEE_COLLECT_PAGE_CONTENT: "true"
      #   BASIC_AUTH_USER: ${{ secrets.BASIC_AUTH_USER }}
      #   BASIC_AUTH_PASSWORD: ${{ secrets.BASIC_AUTH_PASSWORD }}
      # NOTE: PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD was removed here deliberately. It only
      # gates the npm postinstall of the @playwright/browser-* helper packages (which
      # project repos do not depend on) and has NO effect on `npx playwright install`
      # — it never prevented the install below. When the project's Playwright version
      # matches the image-baked browsers, the install is a marker-file no-op; when it
      # differs, the project's browser build is downloaded into PLAYWRIGHT_BROWSERS_PATH
      # (self-heal for projects created from older template versions).
      # See runtime/docs/DEPENDENCY-MAP.md §5.
      shell: bash
      run: |
        npm install --prefer-offline --no-audit
        PROJECT_PW="$(npx playwright --version | awk '{print $NF}')"
        BAKED_PW="$(/opt/npm-global/bin/playwright --version 2>/dev/null | awk '{print $NF}' || echo unknown)"
        echo "Project Playwright: ${PROJECT_PW} | image-baked: ${BAKED_PW}"
        if [ "${PROJECT_PW}" != "${BAKED_PW}" ]; then
          echo "::warning::Project resolves Playwright ${PROJECT_PW} but the runner image bakes browsers for ${BAKED_PW}. Browsers for ${PROJECT_PW} will be downloaded now (slower start, uses /tmp). Align the project's @playwright/test with the image to avoid this."
        fi
        npx playwright install
        npx playwright install ffmpeg
        npm run test

    - name: Confirm end of run
      if: always()
      shell: bash
      run: |

        ERROR_FLAG=false
        if [ "${{ job.status }}" = "failure" ]; then
          ERROR_FLAG=true
        fi

        if [ "${{ github.event.action }}" = "code" ]; then

          IDENTIFIER=""
          if [ -n "${WOPEE_USER_STORY_ID:-}" ] && [ -n "${WOPEE_TEST_CASE_ID:-}" ]; then
            IDENTIFIER="${WOPEE_USER_STORY_ID}:${WOPEE_TEST_CASE_ID}"
          fi

          JSON_PAYLOAD=$(cat <<-EOF
          {
            "query": "mutation PostProcessAgentSuite(\$input: PostProcessAgentSuiteInput!) { postProcessAgentSuite(input: \$input) { postProcessing errorMessage } }",
            "variables": {
              "input": {
                "error": $ERROR_FLAG,
                "projectUuid": "${WOPEE_PROJECT_UUID}",
                "suiteUuid": "${WOPEE_SUITE_UUID}",
                "identifier": "$IDENTIFIER"
              }
            }
          }
        EOF
          )

        else

          # Plain "run" dispatches carry no suite uuid — the suite is created inside the test
          # process and stopped by the wopee reporter. Posting a stop with an empty uuid can
          # only fail (see backlog#4128).
          if [ -z "${WOPEE_SUITE_UUID:-}" ]; then
            echo "No WOPEE_SUITE_UUID - skipping stopIntegrationSuite (suite is stopped by the wopee reporter or lazily by the API)"
            exit 0
          fi

          JSON_PAYLOAD=$(cat <<-EOF
          {
            "query": "mutation StopIntegrationSuite(\$suiteUuid: ID!, \$forceStop: Boolean) { stopIntegrationSuite(suiteUuid: \$suiteUuid, forceStop: \$forceStop) { runningStatus }}",
            "variables": {
              "suiteUuid": "${WOPEE_SUITE_UUID}",
              "forceStop": true
            }
          }
        EOF
          )

        fi

        curl --request POST \
          --header 'content-type: application/json' \
          --header "api_key: ${WOPEE_API_KEY}" \
          --header "x-api-key: ${WOPEE_API_KEY}" \
          --url "${WOPEE_API_URL}" \
          --data "$JSON_PAYLOAD"

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-results
        path: |
          test-results
          playwright-report
        retention-days: 1
